version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
    - "1883:1883"
    - "9005:9001"
    volumes:
    - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    - ./data:/mosquitto/data
    - ./log:/mosquitto/log
